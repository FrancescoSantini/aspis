name: aspis-smk9
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  # 9.25 changes checkpoint re-evaluation and schedules placeholder merge jobs.
  # ASPIS dynamic contrast rules are validated with the stable 9.22 release.
  - snakemake=9.22.0
  - snakemake-executor-plugin-slurm
  - pandas
  - pyyaml
  - sra-tools
  - fastqc
  - multiqc
  - pillow
  - reportlab
  - pypdf
  - svglib
  - fastp
  - cutadapt
  - bowtie
  - star
  - hisat2
  - samtools
  - subread
  - stringtie
  - gffcompare
  - r-base
  - r-optparse
  - r-mass
  - bioconductor-deseq2
  # Native DTU methods use both the R packages and the DEXSeq Python helpers.
  - bioconductor-drimseq
  - bioconductor-dexseq
  - bioconductor-stager
  - suppa
  - bioconductor-isoformswitchanalyzer
  - bioconductor-bsgenome.hsapiens.ncbi.grch38
